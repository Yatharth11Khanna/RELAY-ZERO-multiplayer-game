openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: game
    description: Multiplayer game server operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /game/status:
    get:
      operationId: getGameStatus
      tags: [game]
      summary: Get multiplayer server status
      description: Returns current room and player counts for the game server
      responses:
        "200":
          description: Game server status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameStatus"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    GameStatus:
      type: object
      properties:
        status:
          type: string
        activeRooms:
          type: integer
        connectedPlayers:
          type: integer
        maxPlayersPerRoom:
          type: integer
      required:
        - status
        - activeRooms
        - connectedPlayers
        - maxPlayersPerRoom

